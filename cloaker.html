<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloaker</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/298894342?s=160&v=4" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brown-50:  #fdf8f3;
      --brown-100: #f3e8d8;
      --brown-200: #e4c9a0;
      --brown-300: #c9a06a;
      --brown-400: #a87c4a;
      --brown-500: #8a5c2f;
      --brown-600: #6e4520;
      --brown-700: #522f14;
      --brown-800: #381e0b;
      --brown-900: #1e0f05;
      --cream: #fdf8f3;
      --shadow: 0 8px 40px rgba(56,30,11,0.18), 0 2px 8px rgba(56,30,11,0.10);
    }

    body {
      min-height: 100vh;
      background: var(--brown-900);
      background-image: 
        radial-gradient(ellipse at 20% 30%, rgba(168,124,74,0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(82,47,20,0.35) 0%, transparent 55%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 2rem;
    }

    /* Logo area */
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .logo-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--brown-500);
      padding: 3px;
      background: var(--brown-800);
    }

    .logo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--brown-100);
    }

    .tagline {
      font-size: 0.85rem;
      color: var(--brown-400);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Main card */
    .card {
      background: var(--brown-800);
      border: 1px solid var(--brown-600);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--brown-200);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brown-400);
    }

    /* URL input */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--brown-400);
      font-weight: 600;
    }

    input[type="url"], input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--brown-900);
      border: 1px solid var(--brown-600);
      border-radius: 10px;
      color: var(--brown-100);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input::placeholder { color: var(--brown-500); }

    input:focus {
      border-color: var(--brown-400);
      box-shadow: 0 0 0 3px rgba(168,124,74,0.15);
    }

    /* Cloak options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .option-card {
      background: var(--brown-900);
      border: 1px solid var(--brown-600);
      border-radius: 10px;
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .option-card:hover {
      border-color: var(--brown-400);
      background: var(--brown-800);
    }

    .option-card.selected {
      border-color: var(--brown-400);
      background: rgba(168,124,74,0.12);
    }

    .option-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .option-info { min-width: 0; }

    .option-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--brown-200);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .option-url {
      font-size: 0.68rem;
      color: var(--brown-500);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Radio hidden */
    .option-card input[type="radio"] { display: none; }

    /* Launch button */
    .btn-launch {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--brown-400), var(--brown-600));
      border: none;
      border-radius: 12px;
      color: var(--brown-50);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-launch:hover { opacity: 0.88; }
    .btn-launch:active { transform: scale(0.98); }

    .btn-launch svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Tab preview strip */
    .tab-preview {
      width: 100%;
      max-width: 420px;
      background: var(--brown-800);
      border: 1px solid var(--brown-600);
      border-radius: 12px;
      overflow: hidden;
    }

    .tab-bar {
      background: var(--brown-900);
      padding: 0.4rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--brown-700);
    }

    .tab-dots {
      display: flex;
      gap: 5px;
      margin-right: 0.3rem;
    }

    .tab-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .tab-dot.red   { background: #e06060; }
    .tab-dot.amber { background: #d4a44a; }
    .tab-dot.green { background: #5ab06a; }

    .tab-pill {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--brown-800);
      border: 1px solid var(--brown-600);
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.72rem;
      color: var(--brown-300);
    }

    .tab-pill img {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }

    .tab-preview-body {
      padding: 0.75rem 1rem;
      font-size: 0.78rem;
      color: var(--brown-500);
      font-style: italic;
    }

    /* Divider */
    .divider {
      width: 100%;
      max-width: 420px;
      border: none;
      border-top: 1px solid var(--brown-700);
      opacity: 0.5;
    }

    /* Status message */
    #status {
      font-size: 0.78rem;
      color: var(--brown-400);
      text-align: center;
      min-height: 1.1em;
    }
  </style>
</head>
<body>

  <div class="logo-area">
    <div class="logo-ring">
      <img src="https://avatars.githubusercontent.com/u/298894342?s=160&v=4" alt="Logo">
    </div>
    <div>
      <div class="brand">Cloaker</div>
      <div class="tagline">About:blank redirect tool</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Destination URL</div>

    <div class="input-group">
      <label for="dest-url">URL to open</label>
      <input type="url" id="dest-url" placeholder="https://example.com" autocomplete="off" spellcheck="false">
    </div>

    <div class="card-title" style="margin-top:1.25rem;">Disguise tab as</div>

    <div class="options-grid" id="preset-grid">
      <label class="option-card selected">
        <input type="radio" name="preset" value="google" checked>
        <img class="option-icon" src="https://www.google.com/favicon.ico" alt="">
        <div class="option-info">
          <div class="option-name">Google</div>
          <div class="option-url">google.com</div>
        </div>
      </label>

      <label class="option-card">
        <input type="radio" name="preset" value="drive">
        <img class="option-icon" src="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" alt="">
        <div class="option-info">
          <div class="option-name">Google Drive</div>
          <div class="option-url">drive.google.com</div>
        </div>
      </label>

      <label class="option-card">
        <input type="radio" name="preset" value="docs">
        <img class="option-icon" src="https://ssl.gstatic.com/docs/doclist/images/mediatype/icon_1_document_x32.png" alt="">
        <div class="option-info">
          <div class="option-name">Google Docs</div>
          <div class="option-url">docs.google.com</div>
        </div>
      </label>

      <label class="option-card">
        <input type="radio" name="preset" value="custom">
        <img class="option-icon" src="https://avatars.githubusercontent.com/u/298894342?s=160&v=4" alt="">
        <div class="option-info">
          <div class="option-name">Custom</div>
          <div class="option-url">enter below</div>
        </div>
      </label>
    </div>

    <div class="input-group" id="custom-group" style="display:none;">
      <label for="custom-title">Custom tab title</label>
      <input type="text" id="custom-title" placeholder="Google Classroom">
    </div>

    <button class="btn-launch" onclick="launch()">
      <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Open Cloaked Tab
    </button>
  </div>

  <div class="tab-preview">
    <div class="tab-bar">
      <div class="tab-dots">
        <div class="tab-dot red"></div>
        <div class="tab-dot amber"></div>
        <div class="tab-dot green"></div>
      </div>
      <div class="tab-pill">
        <img id="preview-favicon" src="https://www.google.com/favicon.ico" alt="">
        <span id="preview-title">Google</span>
      </div>
    </div>
    <div class="tab-preview-body">Tab will appear as shown above to onlookers.</div>
  </div>

  <p id="status"></p>

  <script>
    const presets = {
      google: { title: 'Google',       favicon: 'https://www.google.com/favicon.ico' },
      drive:  { title: 'Google Drive', favicon: 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png' },
      docs:   { title: 'Google Docs',  favicon: 'https://ssl.gstatic.com/docs/doclist/images/mediatype/icon_1_document_x32.png' },
      custom: { title: '',             favicon: 'https://avatars.githubusercontent.com/u/298894342?s=160&v=4' }
    };

    const prevFav   = document.getElementById('preview-favicon');
    const prevTitle = document.getElementById('preview-title');
    const customGrp = document.getElementById('custom-group');
    const customTtl = document.getElementById('custom-title');
    const status    = document.getElementById('status');

    document.getElementById('preset-grid').addEventListener('change', e => {
      document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
      e.target.closest('.option-card').classList.add('selected');

      const p = presets[e.target.value];
      prevFav.src   = p.favicon;
      prevTitle.textContent = p.title || customTtl.value || 'Custom Tab';
      customGrp.style.display = e.target.value === 'custom' ? 'flex' : 'none';
      status.textContent = '';
    });

    customTtl.addEventListener('input', () => {
      prevTitle.textContent = customTtl.value || 'Custom Tab';
    });

    function getSelected() {
      return document.querySelector('input[name="preset"]:checked').value;
    }

    function launch() {
      const url = document.getElementById('dest-url').value.trim();
      if (!url) {
        status.textContent = 'Enter a destination URL first.';
        status.style.color = '#c07070';
        return;
      }

      const sel     = getSelected();
      const preset  = presets[sel];
      const tabTitle = sel === 'custom'
        ? (customTtl.value.trim() || 'Google')
        : preset.title;
      const faviconUrl = preset.favicon;

      const win = window.open('about:blank', '_blank');
      if (!win) {
        status.textContent = 'Popup blocked — allow popups and try again.';
        status.style.color = '#c07070';
        return;
      }

      const html = `<!DOCTYPE html>
<html>
<head>
  <title>${escHtml(tabTitle)}</title>
  <link rel="icon" href="${escHtml(faviconUrl)}" type="image/png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe src="${escHtml(url)}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>
</body>
</html>`;

      win.document.open();
      win.document.write(html);
      win.document.close();

      status.textContent = 'Tab opened successfully.';
      status.style.color = '#8ab080';
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
